[package]
name = "hece-engine"
description = "Local speech-to-text engine: mel, VAD, CTranslate2 decode and worker IPC server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
cuda = ["dep:ct2rs"]
cuda-dynamic = ["cuda", "ct2rs/cuda-dynamic-loading"]

[lints]
workspace = true

[dependencies]
hece-core = { path = "../hece-core" }
thiserror.workspace = true
rustfft.workspace = true
flate2.workspace = true
# Pins the bundled zlib so compression ratios match CPython regardless of the system zlib.
libz-sys.workspace = true
tokenizers.workspace = true
ort.workspace = true
ct2rs = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
interprocess.workspace = true
tokio.workspace = true
widestring.workspace = true

[dev-dependencies]
serde_json.workspace = true
hound.workspace = true

[[example]]
name = "transcribe_dir"
required-features = ["cuda"]

[[test]]
name = "engine_real"
required-features = ["cuda"]
