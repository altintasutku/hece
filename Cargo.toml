[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/altintasutku/hece"
version = "0.1.0"
publish = false

[workspace.lints.rust]
# FFI wrapper modules may `#[allow(unsafe_code, reason = "...")]` with a justifying reason.
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stderr = "warn"
print_stdout = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
# Opt-outs from pedantic:
# Crate-prefixed type names (e.g. engine::EngineError) read better at call sites.
module_name_repetitions = "allow"
# Error variants are self-documenting via thiserror messages; per-fn "# Errors" sections add noise.
missing_errors_doc = "allow"
# Panics are forbidden outside tests (unwrap/expect lints), so "# Panics" sections would be empty.
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = true

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
regex = "1.13.1"
fancy-regex = "0.14.0"
unicode-normalization = "0.1.26"
serde_json = "1.0.154"
base64 = "0.23.1"
thiserror = "2.0.21"
rustfft = "6.4.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib"] }
libz-sys = { version = "1.1.31", features = ["static"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
# api-17 minimum (no api-N feature): Silero needs nothing newer, and Windows 11 ships onnxruntime 1.17.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "tracing", "download-binaries", "tls-native", "copy-dylibs"] }
# Never enable the `whisper`/`sentencepiece` features: their protobuf clashes with ort at link time.
ct2rs = { version = "0.10.2", default-features = false, features = ["cuda", "cuda-small-binary", "ruy"] }
hound = "3.5.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tokio = { version = "1.54.1", features = ["net", "process", "time", "io-util", "sync", "macros", "rt-multi-thread"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# Windows only: named pipes for the engine worker IPC.
interprocess = { version = "2.4.7", features = ["tokio"] }
widestring = "1.2.1"
# Cloud STT adapters.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "multipart"] }
# OS credential store: Credential Manager, Keychain, Secret Service.
keyring = "4.2.0"
wiremock = "0.6.5"
# Microphone capture (ALSA on Linux needs libasound2-dev to build).
cpal = "0.18.2"
rubato = "5.0.1"
# Daemon: config file, hidden key prompt, Windows toasts.
toml = "1.1.8"
rpassword = "7.5.4"
tauri-winrt-notification = "0.8.1"
# Local OpenAI-compatible API.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "multipart", "json"] }
# Own accept loop for the API: header-read timeout (axum::serve sets no timer).
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
getrandom = "0.4.3"
